name: portal-image
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portal-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      IMAGE: ghcr.io/perkforge/perkforge-portal
      # Reviewed official Node 24 bookworm-slim linux/amd64 manifest.
      NODE_IMAGE: docker.io/library/node@sha256:2dd9a4f758e173b65fee15388f7706af6fb01ef50cf7a2c0538711d67a6981ae
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run check && npm audit --omit=dev --audit-level=high
      - name: Verify Conventional Commit release behavior offline
        run: |
          npm install --prefix "$RUNNER_TEMP/release-test" --ignore-scripts --no-audit --no-fund release-please@17.3.0
          node scripts/release-version-check.mjs "$RUNNER_TEMP/release-test/package.json"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build once for checks and publication
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          build-args: NODE_IMAGE=${{ env.NODE_IMAGE }}
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=PerkForge Portal
      - name: Check runtime without network or credentials
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --memory 256m --pids-limit 64 --entrypoint node -v "$PWD/scripts/image-smoke.mjs:/tmp/image-smoke.mjs:ro" "$IMAGE:sha-$GITHUB_SHA" /tmp/image-smoke.mjs
      - name: Save checked image for publishing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker save "$IMAGE:sha-$GITHUB_SHA" -o "$RUNNER_TEMP/portal.tar"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: checked-image
          path: ${{ runner.temp }}/portal.tar
          retention-days: 1
  release:
    needs: check-image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  publish:
    needs: [check-image, release]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/perkforge/perkforge-portal
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: checked-image
          path: ${{ runner.temp }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish checked image and record registry digest
        run: |
          set -euo pipefail
          tag="$IMAGE:sha-$GITHUB_SHA"
          docker load -i "$RUNNER_TEMP/portal.tar"
          if docker buildx imagetools inspect "$tag" > /dev/null 2> "$RUNNER_TEMP/lookup-error"; then
            # Retry an interrupted publication without overwriting its existing image.
            docker pull "$tag"
            test "$(docker image inspect "$tag" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          else
            grep -Eqi "not found|manifest unknown" "$RUNNER_TEMP/lookup-error" || { cat "$RUNNER_TEMP/lookup-error" >&2; exit 1; }
            docker push "$tag"
          fi
          docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' > "$RUNNER_TEMP/manifest.json"
          digest=$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/manifest.json")
          docker pull "$IMAGE@$digest"
          test "$(docker image inspect "$tag" --format '{{.Id}}')" = "$(docker image inspect "$IMAGE@$digest" --format '{{.Id}}')"
          # release-please tags the merged release commit. No parsing of commit messages here.
          while IFS= read -r version; do
            [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            gh release view "$version" --json isDraft --jq '.isDraft == false' | grep -qx true
            version_tag="$IMAGE:$version"
            if docker buildx imagetools inspect "$version_tag" --format '{{json .Manifest}}' > "$RUNNER_TEMP/version.json" 2> "$RUNNER_TEMP/lookup-error"; then
              test "$(jq -r .digest "$RUNNER_TEMP/version.json")" = "$digest"
            else
              grep -Eqi "not found|manifest unknown" "$RUNNER_TEMP/lookup-error" || { cat "$RUNNER_TEMP/lookup-error" >&2; exit 1; }
              docker tag "$IMAGE@$digest" "$version_tag"
              docker push "$version_tag"
              docker buildx imagetools inspect "$version_tag" --format '{{json .Manifest}}' > "$RUNNER_TEMP/version.json"
              test "$(jq -r .digest "$RUNNER_TEMP/version.json")" = "$digest"
            fi
            printf 'Version: `%s`\n\n' "$version_tag" >> "$GITHUB_STEP_SUMMARY"
          done < <(git tag --points-at "$GITHUB_SHA" --list 'v*')
          printf 'Source: `%s`\n\nImage: `%s@%s`\n' "$GITHUB_SHA" "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
